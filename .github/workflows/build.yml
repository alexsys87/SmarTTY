name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Run command completion database checks
        run: dotnet run --project tests/CommandCompletionDatabaseTests -c Release

  build:
    name: Build SmarTTY (Release)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: msbuild SmarTTY.csproj -t:Restore -p:Configuration=Release

      - name: Build
        run: msbuild SmarTTY.csproj -p:Configuration=Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: SmarTTY-Release
          path: bin/Release/net48/
          if-no-files-found: error
