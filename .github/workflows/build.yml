name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Run command completion database checks
        run: dotnet run --project tests/CommandCompletionDatabaseTests -c Release

      - name: Run COM/TCP command history checks
        run: dotnet run --project tests/DeviceLineInputTests -c Release

      - name: Run automatic reconnect delay checks
        run: dotnet run --project tests/AutoReconnectPolicyTests -c Release

      - name: Run package manager checks (apk, apt, dnf, yum, zypper, pacman, portage, opkg)
        run: dotnet run --project tests/ApkPackageManagerTests -c Release

      - name: Run XMODEM protocol checks
        run: dotnet run --project tests/XModemTransferTests -c Release

      - name: Run YMODEM protocol checks
        run: dotnet run --project tests/YModemTransferTests -c Release

      - name: Run ZMODEM protocol checks
        run: dotnet run --project tests/ZModemTransferTests -c Release

      - name: Run Kermit protocol checks
        run: dotnet run --project tests/KermitTransferTests -c Release

      - name: Run TFTP server protocol checks
        run: dotnet run --project tests/TftpServerTests -c Release

      - name: Run U-Boot firmware upload helper checks
        run: dotnet run --project tests/UBootFirmwareScriptTests -c Release

      - name: Run text stream decoder checks
        run: dotnet run --project tests/TextStreamDecoderTests -c Release

      - name: Run terminal log writer checks
        run: dotnet run --project tests/TerminalLogWriterTests -c Release

      - name: Run terminal text checks (DEC graphics, UTF-8 decoding)
        run: dotnet run --project tests/TerminalTextTests -c Release

      - name: Run xterm protocol checks (modified keys, mouse, paste, SGR colours)
        run: dotnet run --project tests/XtermProtocolTests -c Release

      - name: Run paste checks (control characters, typographic characters, line breaks, dangerous commands)
        run: dotnet run --project tests/PasteSanitizerTests -c Release

      - name: Run Smart Terminal command line checks (tokens, completion target, quoting, paste, export, shell selection)
        run: dotnet run --project tests/SmartTerminalCommandLineTests -c Release

      - name: Run saved connection lookup checks (user@host from the command line)
        run: dotnet run --project tests/ConnectionLookupTests -c Release

      - name: Run ls output parser checks
        run: dotnet run --project tests/LsOutputParserTests -c Release

      - name: Run df output parser checks (free disk space bar; GNU and BusyBox)
        run: dotnet run --project tests/DfOutputParserTests -c Release

      - name: Run file list operation checks (copy, move, delete, new; /bin/sh and BusyBox)
        run: dotnet run --project tests/RemoteFileOperationsTests -c Release

      - name: Run serial port settings and line status checks
        run: dotnet run --project tests/SerialPortRulesTests -c Release

      - name: Run COM/TCP input and transfer rate checks
        run: dotnet run --project tests/DeviceInputTextTests -c Release

      - name: Run transport write failure checks
        run: dotnet run --project tests/AsyncTransportConnectionTests -c Release

      - name: Run raw TCP transport checks (IPv4/IPv6, keep-alive, connect abort, data flood back-pressure)
        run: dotnet run --project tests/TcpTransportTests -c Release

      - name: Run Telnet protocol checks (options, LINEMODE, STATUS, CHARSET, TLS and STARTTLS, output queue)
        run: dotnet run --project tests/TelnetStreamTests -c Release

      - name: Run TAR extractor security checks
        run: dotnet run --project tests/TarExtractorSecurityTests -c Release

      - name: Run TAR writer checks
        run: dotnet run --project tests/TarWriterTests -c Release

      - name: Run authorized_keys checks
        run: dotnet run --project tests/AuthorizedKeysFileTests -c Release

      - name: Run public key installation checks (script wait, exit status, read-back)
        run: dotnet run --project tests/AuthorizedKeysManagerTests -c Release

      - name: Run path, quoting and size helper checks
        run: dotnet run --project tests/PathAndStringUtilsTests -c Release

      - name: Run editor text model and syntax highlighting checks
        run: dotnet run --project tests/EditorTextTests -c Release

      - name: Run editor autocompletion checks
        run: dotnet run --project tests/EditorCompletionTests -c Release

      - name: Run editor parameter hint checks
        run: dotnet run --project tests/EditorSignatureTests -c Release

      - name: Run API symbol checks
        run: dotnet run --project tests/ApiSymbolTests -c Release

      - name: Run editor tool bar command state checks
        run: dotnet run --project tests/EditorCommandStateTests -c Release

      - name: Run editor search, encoding and line ending checks
        run: dotnet run --project tests/EditorTextFormatTests -c Release

      - name: Run hex editor checks
        run: dotnet run --project tests/HexEditorTests -c Release

      - name: Run local OpenWrt repository checks (opkg and apk feeds, HTTP server, feed scripts, signature check, tunnel host)
        run: dotnet run --project tests/LocalRepoTests -c Release

      - name: Run VcXsrv setup checks (installer selection from the GitHub release data)
        run: dotnet run --project tests/VcxsrvSetupTests -c Release

      - name: Run theme palette checks (matching keys and WCAG contrast for every theme)
        run: dotnet run --project tests/ThemePaletteTests -c Release
      - name: Run icon resource checks (every Icons.Load name is embedded, no .resx left)
        run: dotnet run --project tests/IconResourceTests -c Release

  interop:
    name: File transfer interoperability (lrzsz, C-Kermit, G-Kermit, gzip + base64 through BusyBox ash and bash)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install lrzsz, C-Kermit and G-Kermit
        run: sudo apt-get update && sudo apt-get install -y lrzsz ckermit gkermit python3 socat busybox-static sharutils

      - name: Build the command line clients
        run: |
          dotnet build tests/ModemInterop -c Release
          dotnet build tests/KermitInterop -c Release

      - name: XMODEM, YMODEM and ZMODEM against lrzsz (sx/rx, sb/rb, sz/rz; clean and noisy lines)
        run: python3 tests/ModemInterop/run_interop.py

      - name: Kermit against C-Kermit and G-Kermit (sliding windows, clean and noisy lines)
        run: python3 tests/KermitInterop/run_interop.py

      - name: gzip + base64 transfer through a real shell on a pseudo terminal (BusyBox ash as on OpenWrt, bash; damaged data, cancel, no echo)
        run: dotnet run --project tests/GzipBase64TransferTests -c Release

  sshnet:
    name: SSH.NET integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install OpenSSH server (with xauth for X11 forwarding), Dropbear and BusyBox
        run: sudo apt-get update && sudo apt-get install -y openssh-server xauth python3 dropbear-bin busybox

      - name: Provision the test SSH server
        run: tests/SshNetIntegrationTests/setup-sshd.sh >> "$GITHUB_ENV"

      - name: Provision the Dropbear server with a BusyBox ash shell (as on OpenWRT)
        run: tests/SshNetIntegrationTests/setup-dropbear.sh >> "$GITHUB_ENV"

      - name: Run SSH.NET integration tests
        env:
          SMARTTY_SSH_TEST_REQUIRED: 1
          SMARTTY_DROPBEAR_TEST_REQUIRED: 1
        run: dotnet run --project tests/SshNetIntegrationTests -c Release

      - name: Install Mono and a virtual display for the Smart Terminal checks
        run: sudo apt-get install -y mono-runtime libmono-system-windows-forms4.0-cil libmono-system-drawing4.0-cil libmono-system-xml-linq4.0-cil libmono-microsoft-csharp4.0-cil libgdiplus xvfb

      - name: Build the Smart Terminal checks
        run: dotnet build tests/SmartTerminalIntegrationTests -c Release

      - name: Run the Smart Terminal checks (the real control under Mono, on OpenSSH and Dropbear)
        run: xvfb-run -a mono tests/SmartTerminalIntegrationTests/bin/Release/net48/SmartTerminalIntegrationTests.exe

  build:
    name: Build SmarTTY (Release)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: msbuild SmarTTY.csproj -t:Restore -p:Configuration=Release

      - name: Build
        run: msbuild SmarTTY.csproj -p:Configuration=Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: SmarTTY-Release
          path: bin/Release/net48/
          if-no-files-found: error

  single-exe:
    name: Build SmarTTY single-file executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: msbuild SmarTTY.csproj -t:Restore -p:Configuration=Release -p:SingleExe=true

      - name: Build single-file executable
        run: msbuild SmarTTY.csproj -p:Configuration=Release -p:SingleExe=true

      - name: Verify the dependencies were embedded
        shell: pwsh
        run: |
          $output = "bin/Release/net48"
          $dlls = Get-ChildItem -Path $output -Filter *.dll
          if ($dlls) {
            Write-Error "Expected a self-contained executable, but found dependency DLLs: $($dlls.Name -join ', ')"
          }
          if (-not (Test-Path "$output/SmarTTY.exe")) {
            Write-Error "$output/SmarTTY.exe was not produced"
          }

      - name: Upload single-file executable
        uses: actions/upload-artifact@v7
        with:
          name: SmarTTY-SingleExe
          path: bin/Release/net48/SmarTTY.exe
          if-no-files-found: error
