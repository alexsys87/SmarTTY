name: Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build SmarTTY (Release)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: msbuild SmarTTY.csproj -t:Restore -p:Configuration=Release

      - name: Build (report compiler errors as annotations)
        shell: pwsh
        run: |
          msbuild SmarTTY.csproj -p:Configuration=Release -nologo "-fl" "-flp:logfile=build.log;verbosity=minimal;encoding=utf-8" | Out-Host
          $code = $LASTEXITCODE
          if (Test-Path build.log) {
            $ws = $env:GITHUB_WORKSPACE + '\'
            $errs = Get-Content build.log -Encoding utf8 | Where-Object { $_ -match ' error ' } | ForEach-Object { $_.Replace($ws, '').Trim() } | Sort-Object -Unique
            Write-Host "distinct errors: $(@($errs).Count)"
            $chunk = ''
            $n = 0
            foreach ($e in $errs) {
              if (($chunk.Length + $e.Length) -gt 3000) {
                $n++
                $text = $chunk.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
                Write-Host "::error title=MSBuild errors part $n::$text"
                $chunk = ''
              }
              $chunk += $e + "`n"
            }
            if ($chunk.Length -gt 0) {
              $n++
              $text = $chunk.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
              Write-Host "::error title=MSBuild errors part $n::$text"
            }
          }
          exit $code
