name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Run command completion database checks
        run: dotnet run --project tests/CommandCompletionDatabaseTests -c Release

      - name: Run COM/TCP command history checks
        run: dotnet run --project tests/DeviceLineInputTests -c Release

      - name: Run apk package manager checks
        run: dotnet run --project tests/ApkPackageManagerTests -c Release

  sshnet:
    name: SSH.NET integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install OpenSSH server
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: Provision the test SSH server
        run: tests/SshNetIntegrationTests/setup-sshd.sh >> "$GITHUB_ENV"

      - name: Run SSH.NET integration tests
        env:
          SMARTTY_SSH_TEST_REQUIRED: 1
        run: dotnet run --project tests/SshNetIntegrationTests -c Release

  build:
    name: Build SmarTTY (Release)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: msbuild SmarTTY.csproj -t:Restore -p:Configuration=Release

      - name: Build
        run: msbuild SmarTTY.csproj -p:Configuration=Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: SmarTTY-Release
          path: bin/Release/net48/
          if-no-files-found: error

  single-exe:
    name: Build SmarTTY single-file executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: msbuild SmarTTY.csproj -t:Restore -p:Configuration=Release -p:SingleExe=true

      - name: Build single-file executable
        run: msbuild SmarTTY.csproj -p:Configuration=Release -p:SingleExe=true

      - name: Verify the dependencies were embedded
        shell: pwsh
        run: |
          $output = "bin/Release/net48"
          $dlls = Get-ChildItem -Path $output -Filter *.dll
          if ($dlls) {
            Write-Error "Expected a self-contained executable, but found dependency DLLs: $($dlls.Name -join ', ')"
          }
          if (-not (Test-Path "$output/SmarTTY.exe")) {
            Write-Error "$output/SmarTTY.exe was not produced"
          }

      - name: Upload single-file executable
        uses: actions/upload-artifact@v7
        with:
          name: SmarTTY-SingleExe
          path: bin/Release/net48/SmarTTY.exe
          if-no-files-found: error
