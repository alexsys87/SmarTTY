name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Regression checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build SmarTTY on Linux (compile check only, the Windows application cannot run here)
        run: dotnet build SmarTTY.csproj -c Release

      - name: Run command completion database checks
        run: dotnet run --project tests/CommandCompletionDatabaseTests -c Release

      - name: Run COM/TCP command history checks
        run: dotnet run --project tests/DeviceLineInputTests -c Release

      - name: Run COM/TCP path completion listing checks
        run: dotnet run --project tests/DeviceDirectoryListingTests -c Release

      - name: Run automatic reconnect delay checks
        run: dotnet run --project tests/AutoReconnectPolicyTests -c Release

      - name: Run package manager checks (apk, apt, dnf, yum, zypper, pacman, portage, opkg)
        run: dotnet run --project tests/ApkPackageManagerTests -c Release

      - name: Run XMODEM protocol checks
        run: dotnet run --project tests/XModemTransferTests -c Release

      - name: Run YMODEM protocol checks
        run: dotnet run --project tests/YModemTransferTests -c Release

      - name: Run ZMODEM protocol checks
        run: dotnet run --project tests/ZModemTransferTests -c Release

      - name: Run Kermit protocol checks
        run: dotnet run --project tests/KermitTransferTests -c Release

      - name: Run TFTP server protocol checks
        run: dotnet run --project tests/TftpServerTests -c Release

      - name: Run U-Boot firmware upload helper checks
        run: dotnet run --project tests/UBootFirmwareScriptTests -c Release

      - name: Run text stream decoder checks
        run: dotnet run --project tests/TextStreamDecoderTests -c Release

      - name: Run terminal log writer checks
        run: dotnet run --project tests/TerminalLogWriterTests -c Release

      - name: Run terminal text checks (DEC graphics, UTF-8 decoding)
        run: dotnet run --project tests/TerminalTextTests -c Release

      - name: Run xterm protocol checks (modified keys, mouse, paste, SGR colours)
        run: dotnet run --project tests/XtermProtocolTests -c Release

      - name: Run paste checks (control characters, typographic characters, line breaks, dangerous commands)
        run: dotnet run --project tests/PasteSanitizerTests -c Release

      - name: Run paste history and encoding checks (history order and capacity, characters a code page lacks)
        run: |
          dotnet run --project tests/PasteHistoryTests -c Release
          dotnet run --project tests/PasteEncodingTests -c Release

      - name: Run Smart Terminal command line checks (tokens, completion target, quoting, paste, export, shell selection)
        run: dotnet run --project tests/SmartTerminalCommandLineTests -c Release

      - name: Run saved connection lookup checks (user@host from the command line, host and port, IPv6)
        run: dotnet run --project tests/ConnectionLookupTests -c Release

      - name: Run connection cancel checks (session closed once and off the UI thread, handover race)
        run: dotnet run --project tests/ConnectionAttemptTests -c Release

      - name: Run ls output parser checks
        run: dotnet run --project tests/LsOutputParserTests -c Release

      - name: Run bounded work checks (closing a session)
        run: dotnet run --project tests/BoundedWorkTests -c Release

      - name: Run private mode table checks (CSI ? Pn h/l/s/r with any number)
        run: dotnet run --project tests/PrivateModeTableTests -c Release

      - name: Run remote directory listing checks (file-by-file download; /bin/sh)
        run: dotnet run --project tests/RemoteDirectoryListingTests -c Release

      - name: Run key file replacement checks (Windows host, SFTP; sftp-server of OpenSSH)
        run: dotnet run --project tests/KeyFileReplaceTests -c Release

      - name: Run CSI repeat limit checks (counts from the remote side)
        run: dotnet run --project tests/CsiRepeatLimitTests -c Release

      - name: Run local link policy checks (clicks on paths in device terminals)
        run: dotnet run --project tests/LocalLinkPolicyTests -c Release

      - name: Run remote file signature checks (editor conflict detection; stat, md5sum)
        run: dotnet run --project tests/RemoteFileSignatureTests -c Release

      - name: Run pasted text file name checks
        run: dotnet run --project tests/PastedTextFileTests -c Release

      - name: Run df output parser checks (free disk space bar; GNU and BusyBox)
        run: dotnet run --project tests/DfOutputParserTests -c Release

      - name: Run file list operation checks (copy, move, delete, new; /bin/sh and BusyBox)
        run: dotnet run --project tests/RemoteFileOperationsTests -c Release

      - name: Run serial port settings and line status checks
        run: dotnet run --project tests/SerialPortRulesTests -c Release

      - name: Run COM/TCP input and transfer rate checks
        run: dotnet run --project tests/DeviceInputTextTests -c Release

      - name: Run COM/TCP terminal state checks (prompt and full-screen program in the status bar)
        run: dotnet run --project tests/DeviceTerminalStateTests -c Release

      - name: Run device terminal link checks (network paths are no links, painting never waits for the disk)
        run: dotnet run --project tests/LocalLinkTests -c Release

      - name: Run transport write failure checks
        run: dotnet run --project tests/AsyncTransportConnectionTests -c Release

      - name: Run raw TCP transport checks (IPv4/IPv6, keep-alive, connect abort, data flood back-pressure)
        run: dotnet run --project tests/TcpTransportTests -c Release

      - name: Run local network scan checks (scanned address ranges, open SSH/telnet ports, cancellation, name lookup)
        run: dotnet run --project tests/LocalNetworkScanTests -c Release

      - name: Run Telnet protocol checks (options, LINEMODE, STATUS, CHARSET, TLS and STARTTLS, output queue)
        run: dotnet run --project tests/TelnetStreamTests -c Release

      - name: Run netconsole checks (plain and extended messages, fragments, line and character input over UDP)
        run: dotnet run --project tests/NetconsoleTests -c Release

      - name: Run TAR extractor security checks
        run: dotnet run --project tests/TarExtractorSecurityTests -c Release

      - name: Replies of the SysprogsSync helper (records that arrive in pieces, garbage in the output, the cost of a long batch)
        run: dotnet run --project tests/SysprogsReplyReaderTests -c Release

      - name: Run TAR writer checks
        run: dotnet run --project tests/TarWriterTests -c Release

      - name: Run authorized_keys checks
        run: dotnet run --project tests/AuthorizedKeysFileTests -c Release

      - name: Run connection decision checks (host key comparison, proxy credentials, first password)
        run: dotnet run --project tests/ConnectionRulesTests -c Release

      - name: Run public key installation checks (script wait, exit status, read-back)
        run: dotnet run --project tests/AuthorizedKeysManagerTests -c Release

      - name: Run private key file checks (encrypted key or an unreadable one)
        run: dotnet run --project tests/PrivateKeyFileFormatTests -c Release

      - name: Run path, quoting and size helper checks
        run: dotnet run --project tests/PathAndStringUtilsTests -c Release

      - name: Run editor text model and syntax highlighting checks
        run: dotnet run --project tests/EditorTextTests -c Release

      - name: Run editor autocompletion checks
        run: dotnet run --project tests/EditorCompletionTests -c Release

      - name: Run editor parameter hint checks
        run: dotnet run --project tests/EditorSignatureTests -c Release

      - name: Run editor file check (validation before save) checks
        run: dotnet run --project tests/ConfigValidationTests -c Release

      - name: Run editor Show Changes (line diff) checks
        run: dotnet run --project tests/TextDiffTests -c Release

      - name: Run editor Text menu (line transform) checks
        run: dotnet run --project tests/LineTransformTests -c Release

      - name: Run compiler message column (tabs, bytes) checks
        run: dotnet run --project tests/CompilerColumnTests -c Release

      - name: Run terminal output link (compiler messages) checks
        run: dotnet run --project tests/OutputLinkTests -c Release

      - name: Run multiple cursor checks
        run: dotnet run --project tests/MultiCursorTests -c Release

      - name: Run API symbol checks
        run: dotnet run --project tests/ApiSymbolTests -c Release

      - name: Run editor tool bar command state checks
        run: dotnet run --project tests/EditorCommandStateTests -c Release

      - name: Run editor search, encoding and line ending checks
        run: dotnet run --project tests/EditorTextFormatTests -c Release

      - name: Run hex editor checks
        run: dotnet run --project tests/HexEditorTests -c Release

      - name: Run HEX terminal byte search checks (matches across rows, breaks, row map)
        run: dotnet run --project tests/HexStreamMapTests -c Release

      - name: Check that the logic folders do not refer to WinForms, GDI+, WPF or the view folders (allowlist only shrinks)
        run: tests/check-model-boundary.sh

      - name: Compile the logic folders without Windows types (a hidden dependency on the UI is a compile error)
        run: dotnet run --project tests/ModelBuildTests -c Release

      - name: Run model type checks (RgbColor, GridPoint, VirtualKey, KeyStroke)
        run: dotnet run --project tests/ModelTypesTests -c Release

      - name: Run screen rectangle checks (the remembered window placement is written to XML and read from it as System.Drawing.Rectangle was)
        run: dotnet run --project tests/ScreenRectXmlTests -c Release

      - name: Run folding model checks (fold marks, hidden lines, folded text, expanding; answers of the model before it was separated from the painting)
        run: dotnet run --project tests/FoldingTests -c Release

      - name: Run completion controller checks (suggestion popup and signature hint through ISuggestionPopup and IHintView; suggestion catalog)
        run: dotnet run --project tests/CompletionControllersTests -c Release

      - name: Run line editing checks (lines of a command, replacements between lines, duplicate and move text, the text for the completion; answers of the editor control before they were moved)
        run: dotnet run --project tests/LineEditingTests -c Release

      - name: Run remote file server checks (probes of a file on the server, its version and the conflict text, with a fake connection)
        run: dotnet run --project tests/RemoteFileServerTests -c Release

      - name: Run remote file draft checks (draft keys of two editors, the draft an earlier editor left, when a text is taken, latest write wins, cleanup)
        run: dotnet run --project tests/RemoteFileDraftsTests -c Release

      - name: Run remote file loader checks (new file, write permission and size questions, download and preview, reload, closed tab; fake connection, user and UI thread)
        run: dotnet run --project tests/RemoteFileLoaderTests -c Release

      - name: Run remote file saver checks (upload, check of the file, replacement and its failures, sudo, clean-up, service reload; fake connection)
        run: dotnet run --project tests/RemoteFileSaverTests -c Release

      - name: Run remote file session checks (taking the bytes to save, the CRLF and BOM questions, bytes kept from the hex view, backup, check of the file; fake editor)
        run: dotnet run --project tests/RemoteFileSessionTests -c Release

      - name: Run remote file content checks (the bytes on the server, encoding, line breaks, the switching between the text and the hex view; fake editor and hex view)
        run: dotnet run --project tests/RemoteFileContentTests -c Release

      - name: Run remote file flow checks (the loading and the saves; before the load, during a reload, conflicts, sudo, the check of the file, the service reload offer; fake editor and server)
        run: dotnet run --project tests/RemoteFileFlowTests -c Release

      - name: Run hex editing model checks (caret, selection, typing in both columns, search; what the view is told after each operation)
        run: dotnet run --project tests/HexEditingModelTests -c Release

      - name: Run hex view layout checks (columns, the byte under a point, scrolling to the caret, scroll bars, keys, mouse selection, tool tip and colours)
        run: dotnet run --project tests/HexViewLayoutTests -c Release

      - name: Run hex view menu and data inspector checks (the items of the submenus, when they are enabled or checked, what they do)
        run: dotnet run --project tests/HexMenuInspectorTests -c Release

      - name: Run the hex editor script on the models (the script and the golden file of the removed WinForms hex control, replayed on the hex models)
        run: dotnet run --project tests/HexEditorModelSnapshots -c Release

      - name: Run caret navigation and wrap map checks (where the caret of the text view goes by a key, the column kept, the word under the caret, the breaks of wrapped lines)
        run: dotnet run --project tests/CaretNavigatorTests -c Release

      - name: Run text view layout checks (the rows, the margin, the point of a position and the position under a point, scrolling, the scroll bars, the selection by the mouse of the WPF text view)
        run: dotnet run --project tests/TextViewLayoutTests -c Release

      - name: Run editor completion checks (when the word list of a code editor opens, what it selects and accepts, and the parameter hint of a call; what the list selects and puts on top, and its keys)
        run: dotnet run --project tests/EditorCompletionModelTests -c Release

      - name: Run line command checks (duplicate, move, delete and comment lines, the transforms of the Text menu, the moves to a bracket, the zoom steps)
        run: dotnet run --project tests/LineCommandTests -c Release

      - name: Run text search checks (the search of a text view, the highlight of the matches, the pair of a bracket, the marks of the blanks)
        run: dotnet run --project tests/TextSearchTests -c Release

      - name: Run cursor session checks (what a code editor does with several cursors - the commands, typing, the keys, copy, cut, paste, Alt+click)
        run: dotnet run --project tests/MultiCursorSessionTests -c Release

      - name: Run syntax choice checks (the syntax chosen by hand, detected from the file, and applied)
        run: dotnet run --project tests/SyntaxChoiceTests -c Release

      - name: Run terminal helper checks (the SGR style, the CSI parameters and the OSC string of the escape sequence parser)
        run: dotnet run --project tests/TerminalHelpersTests -c Release

      - name: Run terminal emulator checks (what the CSI commands, the modes and the OSC strings do, with a fake screen and host)
        run: dotnet run --project tests/TerminalEmulatorTests -c Release

      - name: Run terminal screen checks (the cursor, writing with wrap and scroll, the scroll region, erasing, the two buffers, the batch, the scrollback, resize)
        run: dotnet run --project tests/TerminalScreenTests -c Release

      - name: Run WPF terminal view model checks (the colours of the cells, the runs of a row, the output queue of a frame, the display model)
        run: dotnet run --project tests/TerminalRenderModelTests -c Release

      - name: Run the terminal goldens on the WPF display model (screen state, painted colours, mouse reports)
        run: dotnet run --project tests/TerminalModelSnapshots -c Release

      - name: Run WPF terminal keyboard checks (KeyDown and TextInput to xterm bytes, AltGr, Alt codes, dead keys, IME)
        run: dotnet run --project tests/TerminalKeyEncoderTests -c Release

      - name: Run local link scanner checks (the addresses and paths in the text of a device terminal)
        run: dotnet run --project tests/LocalLinkScannerTests -c Release

      - name: Run local completion checks (the built-in commands, the programs of PATH, the names of a device directory, the rules of a word)
        run: dotnet run --project tests/LocalCompletionItemsTests -c Release

      - name: Run history walk checks (Up and Down through the history of a line edited in place, the edits kept on the way)
        run: dotnet run --project tests/HistoryWalkTests -c Release

      - name: Run session environment checks (the variables of a Smart Terminal tab, their order, replacement and unset, the exports put in front of a command)
        run: dotnet run --project tests/SessionEnvironmentTests -c Release

      - name: Run input region map checks (the text of a command line edited in place, and its indices and positions over several rows)
        run: dotnet run --project tests/InputRegionMapTests -c Release

      - name: Run line paste checks (the state of a paste line by line, its progress text, its notes and the cancel)
        run: dotnet run --project tests/LinePasteRunTests -c Release

      - name: Run history suggestion checks (the grey rest of a typed command of a local line, when it shows and what hides it)
        run: dotnet run --project tests/HistorySuggestionStateTests -c Release

      - name: "Run suggestion lookup checks (what the grey suggestion of the Smart Terminal line keeps: the history, when it is made again, the last answer)"
        run: dotnet run --project tests/SuggestionLookupTests -c Release

      - name: "Run device listing checks (the listing of a device directory for the path completion: the answer, the timeouts, the waiting request, the held input)"
        run: dotnet run --project tests/DeviceListingSessionTests -c Release

      - name: Run netconsole line input checks (the history walk of the input box and its draft, what typed text does to the box)
        run: dotnet run --project tests/NetconsoleLineInputTests -c Release

      - name: "Run device command list checks (the saved history and the command lists of a COM/TCP device: loading, saving, deleting, clearing)"
        run: dotnet run --project tests/DeviceCommandListsTests -c Release

      - name: Run local completion session checks (the completion of a command, a path or a directory in the input line of a device terminal)
        run: dotnet run --project tests/LocalCompletionSessionTests -c Release

      - name: Run hex terminal model checks (the rows the bytes are formatted into, chunks and breaks, the layout made again, the match of the search, columns of the two views)
        run: dotnet run --project tests/HexTerminalModelTests -c Release

      - name: Run line history checks (the commands of a local input line, Up and Down, Ctrl+R)
        run: dotnet run --project tests/LineHistoryTests -c Release

      - name: Run terminal line information checks (which lines are kept, the styles of the cells, shifting cells, inserted and removed lines)
        run: dotnet run --project tests/LineInfoStoreTests -c Release

      - name: Run local OpenWrt repository checks (opkg and apk feeds, HTTP server, feed scripts, signature check, tunnel host)
        run: dotnet run --project tests/LocalRepoTests -c Release

      - name: Run VcXsrv setup checks (installer selection from the GitHub release data)
        run: dotnet run --project tests/VcxsrvSetupTests -c Release

      - name: Run theme palette checks (matching keys and WCAG contrast for every theme)
        run: dotnet run --project tests/ThemePaletteTests -c Release

      - name: Run settings window layout checks (fixed size, one scroll viewer per tab)
        run: dotnet run --project tests/SettingsWindowLayoutTests -c Release

      - name: Run folder browser checks (themed chooser replaced the native FolderBrowserDialog)
        run: dotnet run --project tests/FolderBrowserTests -c Release

      - name: Run file dialog checks (themed chooser replaced the native OpenFileDialog/SaveFileDialog)
        run: dotnet run --project tests/FileDialogTests -c Release

      - name: Run snippet editor checks (themed editor replaced the WinForms SnippetEditForm)
        run: dotnet run --project tests/SnippetEditorTests -c Release

      - name: Run paste confirmation checks (themed window replaced the WinForms PasteConfirmForm)
        run: dotnet run --project tests/PasteConfirmTests -c Release

      - name: Run paste progress checks (themed window replaced the WinForms PasteProgressForm)
        run: dotnet run --project tests/PasteProgressTests -c Release

      - name: Run folder synchronization settings checks (direction, options, exclusion masks)
        run: dotnet run --project tests/SyncRequestTests -c Release

      - name: Run icon resource checks (every Icons.Load name is embedded, no .resx left)
        run: dotnet run --project tests/IconResourceTests -c Release

      - name: Run XAML encoding checks (non-ASCII markup keeps its UTF-8 BOM)
        run: dotnet run --project tests/XamlEncodingTests -c Release

      - name: Run XAML template checks (no ContentTemplate repeats itself through a bare ContentPresenter)
        run: dotnet run --project tests/XamlTemplateTests -c Release

      - name: Run public key window layout checks (the window grows to the key, capped to the screen)
        run: dotnet run --project tests/PublicKeyWindowLayoutTests -c Release

      - name: Run local folder browser checks (roots, child folders, ordering, path normalization)
        run: dotnet run --project tests/LocalFolderTreeTests -c Release

  interop:
    name: File transfer interoperability (lrzsz, C-Kermit, G-Kermit, gzip + base64 and gzip + cat through BusyBox ash and bash)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install lrzsz, C-Kermit and G-Kermit
        run: sudo apt-get update && sudo apt-get install -y lrzsz ckermit gkermit python3 socat busybox-static sharutils

      - name: Build the command line clients
        run: |
          dotnet build tests/ModemInterop -c Release
          dotnet build tests/KermitInterop -c Release

      - name: XMODEM, YMODEM and ZMODEM against lrzsz (sx/rx, sb/rb, sz/rz; clean and noisy lines)
        run: python3 tests/ModemInterop/run_interop.py

      - name: Kermit against C-Kermit and G-Kermit (sliding windows, clean and noisy lines)
        run: python3 tests/KermitInterop/run_interop.py

      - name: gzip + base64 and gzip + cat (raw) transfer through a real shell on a pseudo terminal (BusyBox ash as on OpenWrt, bash; damaged data, cancel, no echo)
        run: dotnet run --project tests/GzipBase64TransferTests -c Release

      - name: Backup to and restore from tar.gz (mount table, folder tree, tar streamed to stdout and stdin, md5sum check; /bin/sh with GNU tar, BusyBox ash with BusyBox tar as on OpenWrt)
        run: dotnet run --project tests/RemoteBackupTests -c Release

      - name: Flash (MTD) backup and restore (/proc/mtd and sysfs, full flash layout, RAM check, upload, write and read-back with fake flash tools; /bin/sh and BusyBox)
        run: dotnet run --project tests/MtdFlashTests -c Release

      - name: Quick commands (rules, QuickCommands.xml and the settings archive, script upload with chmod and the typed ./name; /bin/sh and BusyBox)
        run: dotnet run --project tests/QuickCommandsTests -c Release

      - name: Memory (devmem) (values in every form, bits and fields, the output of devmem and devmem2, bus errors, the read and write commands against stand-in tools; /bin/sh and BusyBox)
        run: dotnet run --project tests/DevMemTests -c Release

      - name: Saving a file of the remote editor (free space, a write that fails half way is put back, read-back, restore copy; /bin/sh, bash and BusyBox, stand-in df and cat, the size limit of a process for a full disk)
        run: dotnet run --project tests/RemoteSaveCommandTests -c Release

  sshnet:
    name: SSH.NET integration tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install OpenSSH server (with xauth for X11 forwarding), Dropbear and BusyBox
        run: sudo apt-get update && sudo apt-get install -y openssh-server xauth python3 dropbear-bin busybox

      - name: Provision the test SSH server
        run: tests/SshNetIntegrationTests/setup-sshd.sh >> "$GITHUB_ENV"

      - name: Provision the Dropbear server with a BusyBox ash shell (as on OpenWRT)
        run: tests/SshNetIntegrationTests/setup-dropbear.sh >> "$GITHUB_ENV"

      - name: Run SSH.NET integration tests
        env:
          SMARTTY_SSH_TEST_REQUIRED: 1
          SMARTTY_DROPBEAR_TEST_REQUIRED: 1
        run: dotnet run --project tests/SshNetIntegrationTests -c Release

      - name: Install Mono and a virtual display for the remote file editor and hex editor checks
        run: sudo apt-get install -y mono-runtime libmono-system-windows-forms4.0-cil libmono-system-drawing4.0-cil libmono-system-xml-linq4.0-cil libmono-microsoft-csharp4.0-cil libmono-windowsbase4.0-cil libmono-i18n4.0-all libgdiplus xvfb

      - name: Build the remote file editor checks
        run: dotnet build tests/RemoteFileEditorIntegrationTests -c Release

      - name: Run the remote file editor checks (the real editor loads, changes, saves and reloads files on OpenSSH and Dropbear, under Mono)
        run: xvfb-run -a mono tests/RemoteFileEditorIntegrationTests/bin/Release/net48/RemoteFileEditorIntegrationTests.exe

      - name: Build the model interop checks
        run: dotnet build tests/ModelInteropTests -c Release

      - name: Run the model interop checks (VirtualKey matches the WinForms Keys member by member, the key conversions, the colour numbers of the settings are the named GDI+ colours they replaced, under Mono)
        run: xvfb-run -a mono tests/ModelInteropTests/bin/Release/net48/ModelInteropTests.exe

  build:
    name: Build SmarTTY (Release)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build SmarTTY.csproj -c Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: SmarTTY-Release
          path: bin/Release/net10.0-windows/
          if-no-files-found: error

  single-exe:
    name: Build SmarTTY single-file executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file executable
        run: dotnet publish SmarTTY.csproj -c Release -p:SingleExe=true

      - name: Verify the dependencies were embedded
        shell: pwsh
        run: |
          $output = "bin/Release/net10.0-windows/publish"
          $extra = Get-ChildItem -Path $output | Where-Object { $_.Name -notin @('SmarTTY.exe', 'SmarTTY.pdb') }
          if ($extra) {
            Write-Error "Expected a self-contained executable, but found other files: $($extra.Name -join ', ')"
          }
          if (-not (Test-Path "$output/SmarTTY.exe")) {
            Write-Error "$output/SmarTTY.exe was not produced"
          }
          "SmarTTY.exe size: {0:N0} bytes" -f (Get-Item "$output/SmarTTY.exe").Length

      - name: Upload single-file executable
        uses: actions/upload-artifact@v7
        with:
          name: SmarTTY-SingleExe
          path: bin/Release/net10.0-windows/publish/SmarTTY.exe
          if-no-files-found: error
